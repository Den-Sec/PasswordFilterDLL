name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: Build & test (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake, VS2022, x64)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Run unit tests (CTest)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload DLL artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PasswordFilterDLL-x64
          path: build/src/dll/Release/PasswordFilterDLL.dll
          if-no-files-found: warn

  sanitizers:
    name: Sanitizers (Linux, ASan + UBSan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The DLL is Windows-only (auto-skipped off WIN32); this exercises the portable
      # pwfilter_core + tests under AddressSanitizer and UndefinedBehaviorSanitizer, so
      # memory-safety of the code that ultimately runs in LSASS is proven, not just asserted.
      - name: Configure (Clang, ASan + UBSan)
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -B build-san
          -DCMAKE_BUILD_TYPE=Debug
          -DPWFILTER_BUILD_DLL=OFF
          -DPWFILTER_WERROR=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-san -j

      - name: Run unit tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-san --output-on-failure
